<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Un clic remonte le DOM</title><desc id="description">Dans la phase de bouillonnement, un clic sur le bouton traverse le bouton puis son parent. La capture suit l’autre sens.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Un clic remonte le DOM</text><rect x="100" y="95" width="680" height="300" rx="18" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="270" y="135" text-anchor="middle" font-size="24" fill="#272238">Parent : section</text><rect x="215" y="215" width="300" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="365" y="273" text-anchor="middle" font-size="24" fill="#272238">Cible : bouton</text><path d="M 565 265 L 685 265" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="625" y="253" text-anchor="middle" font-size="22" fill="#272238">clic</text><path d="M 690 250 L 690 155" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="690" y="190.5" text-anchor="middle" font-size="22" fill="#272238">remonte</text><text x="440" y="365" text-anchor="middle" font-size="24" fill="#272238">Cible puis parent : phase de bouillonnement.</text></g></svg>
