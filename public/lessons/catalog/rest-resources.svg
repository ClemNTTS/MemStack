<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Ressource et représentation</title><desc id="description">Une URL désigne une ressource. GET en demande la représentation ; DELETE demande sa suppression selon le contrat.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Ressource et représentation</text><rect x="40" y="140" width="235" height="140" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="157.5" y="203" text-anchor="middle" font-size="24" fill="#272238">/lessons/42</text><text x="157.5" y="233" text-anchor="middle" font-size="24" fill="#272238">ressource</text><rect x="600" y="75" width="230" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="715" y="118" text-anchor="middle" font-size="24" fill="#272238">GET</text><text x="715" y="148" text-anchor="middle" font-size="24" fill="#272238">représentation</text><rect x="600" y="290" width="230" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="715" y="333" text-anchor="middle" font-size="24" fill="#272238">DELETE</text><text x="715" y="363" text-anchor="middle" font-size="24" fill="#272238">suppression</text><path d="M 280 180 L 590 125" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 280 230 L 590 340" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="425" text-anchor="middle" font-size="24" fill="#272238">La méthode exprime l’intention ; les droits restent vérifiés.</text></g></svg>
