<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Le stockage indépendant du conteneur</title><desc id="description">Un conteneur remplacé peut retrouver les données du même volume. La couche inscriptible du conteneur ne survit pas à sa suppression.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Le stockage indépendant du conteneur</text><rect x="45" y="110" width="260" height="120" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="175" y="163" text-anchor="middle" font-size="24" fill="#272238">Conteneur A</text><text x="175" y="193" text-anchor="middle" font-size="24" fill="#272238">supprimé</text><rect x="575" y="110" width="260" height="120" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="705" y="163" text-anchor="middle" font-size="24" fill="#272238">Conteneur B</text><text x="705" y="193" text-anchor="middle" font-size="24" fill="#272238">remplacement</text><rect x="310" y="300" width="260" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="440" y="343" text-anchor="middle" font-size="24" fill="#272238">Volume nommé</text><text x="440" y="373" text-anchor="middle" font-size="24" fill="#272238">données persistantes</text><path d="M 175 240 L 330 295" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="252.5" y="255.5" text-anchor="middle" font-size="22" fill="#272238">écriture</text><path d="M 550 295 L 705 240" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="627.5" y="255.5" text-anchor="middle" font-size="22" fill="#272238">lecture</text><text x="440" y="78" text-anchor="middle" font-size="24" fill="#272238">Le volume a un cycle de vie distinct.</text></g></svg>
