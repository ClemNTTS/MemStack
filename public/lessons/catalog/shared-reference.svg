<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Deux variables, un objet</title><desc id="description">a et b désignent le même objet. Modifier b.score modifie l’objet lu par a.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Deux variables, un objet</text><rect x="60" y="100" width="200" height="85" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="160" y="150.5" text-anchor="middle" font-size="24" fill="#272238">a</text><rect x="60" y="285" width="200" height="85" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="160" y="335.5" text-anchor="middle" font-size="24" fill="#272238">b = a</text><rect x="580" y="185" width="240" height="115" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="700" y="235.5" text-anchor="middle" font-size="24" fill="#272238">Même objet</text><text x="700" y="265.5" text-anchor="middle" font-size="24" fill="#272238">score : 1 → 2</text><path d="M 265 145 L 570 220" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 265 325 L 570 260" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="420" text-anchor="middle" font-size="24" fill="#272238">Une nouvelle variable ne crée pas un nouvel objet.</text></g></svg>
