<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Alternance collections et documents</title><desc id="description">Le chemin users/uid/cards/cardId alterne collection, document, collection et document. Chaque document contient des champs.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Alternance collections et documents</text><rect x="25" y="110" width="185" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="117.5" y="148" text-anchor="middle" font-size="24" fill="#272238">users</text><text x="117.5" y="178" text-anchor="middle" font-size="24" fill="#272238">collection</text><rect x="245" y="110" width="185" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="337.5" y="148" text-anchor="middle" font-size="24" fill="#272238">uid</text><text x="337.5" y="178" text-anchor="middle" font-size="24" fill="#272238">document</text><rect x="465" y="110" width="185" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="557.5" y="148" text-anchor="middle" font-size="24" fill="#272238">cards</text><text x="557.5" y="178" text-anchor="middle" font-size="24" fill="#272238">collection</text><rect x="685" y="110" width="170" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="770" y="148" text-anchor="middle" font-size="24" fill="#272238">cardId</text><text x="770" y="178" text-anchor="middle" font-size="24" fill="#272238">document</text><path d="M 215 155 L 235 155" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 435 155 L 455 155" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 655 155 L 675 155" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="285" width="265" height="95" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="692.5" y="325.5" text-anchor="middle" font-size="24" fill="#272238">Champs du document</text><text x="692.5" y="355.5" text-anchor="middle" font-size="24" fill="#272238">rating, dueAt…</text><path d="M 770 210 L 705 275" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="270" y="340" text-anchor="middle" font-size="24" fill="#272238">Un chemin logique,</text><text x="270" y="375" text-anchor="middle" font-size="24" fill="#272238">pas des fichiers sur disque.</text></g></svg>
