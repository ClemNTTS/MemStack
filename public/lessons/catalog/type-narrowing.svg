<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Préciser un type inconnu</title><desc id="description">Un test typeof distingue la branche string de la branche non string. La vérification permet des opérations adaptées.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Préciser un type inconnu</text><rect x="30" y="175" width="230" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="145" y="228" text-anchor="middle" font-size="24" fill="#272238">valeur : unknown</text><rect x="335" y="175" width="230" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="450" y="213" text-anchor="middle" font-size="24" fill="#272238">typeof valeur</text><text x="450" y="243" text-anchor="middle" font-size="24" fill="#272238">=== « string » ?</text><rect x="620" y="80" width="225" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="732.5" y="118" text-anchor="middle" font-size="24" fill="#272238">Oui : string</text><text x="732.5" y="148" text-anchor="middle" font-size="24" fill="#272238">toUpperCase()</text><rect x="620" y="300" width="225" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="732.5" y="338" text-anchor="middle" font-size="24" fill="#272238">Non : autre</text><text x="732.5" y="368" text-anchor="middle" font-size="24" fill="#272238">pas de méthode string</text><path d="M 265 220 L 325 220" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 570 200 L 610 125" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 570 240 L 610 345" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/></g></svg>
