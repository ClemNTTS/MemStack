<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Des transitions explicites</title><desc id="description">Une demande fait passer idle à loading puis success ou error. Une erreur peut déclencher une nouvelle tentative.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Des transitions explicites</text><rect x="40" y="180" width="180" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="130" y="233" text-anchor="middle" font-size="24" fill="#272238">idle</text><rect x="335" y="180" width="180" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="425" y="233" text-anchor="middle" font-size="24" fill="#272238">loading</text><rect x="620" y="80" width="210" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="725" y="133" text-anchor="middle" font-size="24" fill="#272238">success</text><rect x="620" y="290" width="210" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="725" y="343" text-anchor="middle" font-size="24" fill="#272238">error</text><path d="M 225 225 L 325 225" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="275" y="213" text-anchor="middle" font-size="22" fill="#272238">demande</text><path d="M 520 200 L 610 125" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 520 245 L 610 335" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 725 385 L 425 385 L 425 280" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="575" y="420" text-anchor="middle" font-size="24" fill="#272238">nouvelle tentative</text></g></svg>
