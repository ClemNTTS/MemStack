<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Identité puis autorisation</title><desc id="description">Une identité valide est vérifiée avant la permission sur un objet donné. Être Alice ne donne pas les données de Bob.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Identité puis autorisation</text><rect x="35" y="150" width="240" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="155" y="188" text-anchor="middle" font-size="24" fill="#272238">Qui es-tu ?</text><text x="155" y="218" text-anchor="middle" font-size="24" fill="#272238">authentification</text><rect x="320" y="150" width="240" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="440" y="188" text-anchor="middle" font-size="24" fill="#272238">Cet objet est-il</text><text x="440" y="218" text-anchor="middle" font-size="24" fill="#272238">autorisé pour toi ?</text><rect x="605" y="150" width="240" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="725" y="188" text-anchor="middle" font-size="24" fill="#272238">Accès</text><text x="725" y="218" text-anchor="middle" font-size="24" fill="#272238">ou refus</text><path d="M 275 195 L 315 195" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 560 195 L 600 195" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="320" text-anchor="middle" font-size="24" fill="#272238">Alice authentifiée + document de Bob ≠ accès autorisé.</text><text x="440" y="354" text-anchor="middle" font-size="24" fill="#272238">Le contrôle doit être réalisé côté autorité des données.</text></g></svg>
