<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Consulter un cache valide</title><desc id="description">Le cache doit contenir une entrée encore valide pour répondre. Une entrée absente ou expirée impose de recharger la source puis de remplir le cache.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Consulter un cache valide</text><rect x="25" y="170" width="215" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="132.5" y="228" text-anchor="middle" font-size="24" fill="#272238">Demande</text><rect x="285" y="145" width="290" height="150" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="430" y="213" text-anchor="middle" font-size="24" fill="#272238">Entrée présente</text><text x="430" y="243" text-anchor="middle" font-size="24" fill="#272238">et valide ?</text><rect x="625" y="70" width="230" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="740" y="113" text-anchor="middle" font-size="24" fill="#272238">Oui</text><text x="740" y="143" text-anchor="middle" font-size="24" fill="#272238">retour du cache</text><rect x="625" y="310" width="230" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="740" y="353" text-anchor="middle" font-size="24" fill="#272238">Non</text><text x="740" y="383" text-anchor="middle" font-size="24" fill="#272238">charger la source</text><path d="M 245 220 L 275 220" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 580 185 L 615 125" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 580 265 L 615 360" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="435" text-anchor="middle" font-size="22" fill="#272238">Définir expiration ou invalidation selon le besoin métier.</text></g></svg>
