<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Une observation discriminante</title><desc id="description">Une observation est choisie pour distinguer deux hypothèses. Le résultat guide l’enquête plutôt que de multiplier les modifications.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Une observation discriminante</text><rect x="40" y="180" width="245" height="110" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="162.5" y="228" text-anchor="middle" font-size="24" fill="#272238">Symptôme</text><text x="162.5" y="258" text-anchor="middle" font-size="24" fill="#272238">page en erreur</text><rect x="355" y="180" width="245" height="110" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="477.5" y="228" text-anchor="middle" font-size="24" fill="#272238">Observer</text><text x="477.5" y="258" text-anchor="middle" font-size="24" fill="#272238">la réponse réseau</text><rect x="640" y="75" width="205" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="742.5" y="118" text-anchor="middle" font-size="24" fill="#272238">Réponse 500</text><text x="742.5" y="148" text-anchor="middle" font-size="24" fill="#272238">piste serveur</text><rect x="640" y="305" width="205" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="742.5" y="348" text-anchor="middle" font-size="24" fill="#272238">Réponse 200</text><text x="742.5" y="378" text-anchor="middle" font-size="24" fill="#272238">autre piste</text><path d="M 290 230 L 345 230" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 605 205 L 630 130" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 605 265 L 630 355" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="435" text-anchor="middle" font-size="22" fill="#272238">Une piste n’est pas une preuve : poursuivre la vérification.</text></g></svg>
