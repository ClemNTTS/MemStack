<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Mesurer un chemin critique</title><desc id="description">Dans cet exemple séquentiel, le téléchargement du bundle dure davantage que le traitement serveur. Mesurer permet de cibler ce coût.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Mesurer un chemin critique</text><text x="190" y="110" text-anchor="middle" font-size="24" fill="#272238">Serveur : 80 ms</text><rect x="90" y="130" width="95" height="40" rx="8" fill="#d8c5ed"/><text x="440" y="205" text-anchor="middle" font-size="24" fill="#272238">Bundle : 400 ms</text><rect x="190" y="225" width="470" height="40" rx="8" fill="#73539a"/><text x="660" y="300" text-anchor="middle" font-size="24" fill="#272238">Rendu : 60 ms</text><rect x="665" y="320" width="72" height="40" rx="8" fill="#d8c5ed"/><path d="M 70 390 L 810 390" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="378" text-anchor="middle" font-size="22" fill="#272238">Temps →</text><text x="440" y="435" text-anchor="middle" font-size="22" fill="#272238">Exemple pédagogique, pas une mesure de MemStack.</text></g></svg>
