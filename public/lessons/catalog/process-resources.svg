<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Un programme, deux processus</title><desc id="description">Le même programme peut démarrer deux processus ayant leur propre mémoire et leurs propres ressources.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Un programme, deux processus</text><rect x="315" y="90" width="250" height="80" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="440" y="138" text-anchor="middle" font-size="24" fill="#272238">Programme sur disque</text><rect x="60" y="275" width="310" height="110" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="215" y="323" text-anchor="middle" font-size="24" fill="#272238">Processus 1</text><text x="215" y="353" text-anchor="middle" font-size="24" fill="#272238">mémoire + ressources</text><rect x="510" y="275" width="310" height="110" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="665" y="323" text-anchor="middle" font-size="24" fill="#272238">Processus 2</text><text x="665" y="353" text-anchor="middle" font-size="24" fill="#272238">mémoire + ressources</text><path d="M 370 180 L 225 265" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="297.5" y="210.5" text-anchor="middle" font-size="22" fill="#272238">lancer</text><path d="M 510 180 L 655 265" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="582.5" y="210.5" text-anchor="middle" font-size="22" fill="#272238">lancer</text></g></svg>
