<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Un échange HTTP</title><desc id="description">Le client envoie GET /lessons au serveur. Le serveur répond 200 avec une représentation JSON.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Un échange HTTP</text><rect x="50" y="105" width="240" height="220" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="170" y="208" text-anchor="middle" font-size="24" fill="#272238">Client</text><text x="170" y="238" text-anchor="middle" font-size="24" fill="#272238">Navigateur</text><rect x="590" y="105" width="240" height="220" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="710" y="208" text-anchor="middle" font-size="24" fill="#272238">Serveur</text><text x="710" y="238" text-anchor="middle" font-size="24" fill="#272238">API</text><path d="M 295 165 L 580 165" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="437.5" y="153" text-anchor="middle" font-size="22" fill="#272238">GET /lessons</text><path d="M 585 275 L 300 275" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="442.5" y="263" text-anchor="middle" font-size="22" fill="#272238">200 + JSON</text><text x="440" y="390" text-anchor="middle" font-size="24" fill="#272238">Une requête appelle une réponse ; le corps dépend du besoin.</text></g></svg>
