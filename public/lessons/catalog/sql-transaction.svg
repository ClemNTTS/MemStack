<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Valider une transaction</title><desc id="description">BEGIN ouvre une transaction ; deux écritures sont validées ensemble par COMMIT ou annulées par ROLLBACK.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Valider une transaction</text><rect x="35" y="150" width="240" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="155" y="203" text-anchor="middle" font-size="24" fill="#272238">BEGIN</text><rect x="320" y="150" width="240" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="440" y="188" text-anchor="middle" font-size="24" fill="#272238">Deux écritures</text><text x="440" y="218" text-anchor="middle" font-size="24" fill="#272238">liées</text><rect x="605" y="150" width="240" height="90" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="725" y="188" text-anchor="middle" font-size="24" fill="#272238">COMMIT</text><text x="725" y="218" text-anchor="middle" font-size="24" fill="#272238">tout valider</text><path d="M 275 195 L 315 195" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 560 195 L 600 195" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="320" text-anchor="middle" font-size="24" fill="#272238">Une erreur ? ROLLBACK annule les écritures de la transaction.</text><text x="440" y="354" text-anchor="middle" font-size="24" fill="#272238">L’atomicité évite de conserver une opération à moitié réalisée.</text></g></svg>
