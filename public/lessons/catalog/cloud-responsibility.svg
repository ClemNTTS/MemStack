<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Répartir les responsabilités</title><desc id="description">Dans cet exemple de conteneur géré, le fournisseur gère l’hôte. Le client garde le code, les permissions et les données.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Répartir les responsabilités</text><rect x="50" y="105" width="350" height="210" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="225" y="188" text-anchor="middle" font-size="24" fill="#272238">Fournisseur</text><text x="225" y="218" text-anchor="middle" font-size="24" fill="#272238">Hôte + plateforme</text><text x="225" y="248" text-anchor="middle" font-size="24" fill="#272238">selon le service</text><rect x="480" y="105" width="350" height="210" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="655" y="188" text-anchor="middle" font-size="24" fill="#272238">Client</text><text x="655" y="218" text-anchor="middle" font-size="24" fill="#272238">Code + permissions</text><text x="655" y="248" text-anchor="middle" font-size="24" fill="#272238">données + configuration</text><text x="440" y="365" text-anchor="middle" font-size="24" fill="#272238">La frontière varie selon VM, service géré ou fonction.</text><text x="440" y="405" text-anchor="middle" font-size="24" fill="#272238">Géré ne signifie pas exempt de responsabilités.</text></g></svg>
