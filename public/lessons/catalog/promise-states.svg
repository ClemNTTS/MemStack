<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Les états d’une promesse</title><desc id="description">Une promesse en attente peut devenir accomplie ou rejetée. Ces deux états sont terminaux.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Les états d’une promesse</text><rect x="40" y="180" width="220" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="150" y="223" text-anchor="middle" font-size="24" fill="#272238">pending</text><text x="150" y="253" text-anchor="middle" font-size="24" fill="#272238">en attente</text><rect x="600" y="85" width="230" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="715" y="128" text-anchor="middle" font-size="24" fill="#272238">fulfilled</text><text x="715" y="158" text-anchor="middle" font-size="24" fill="#272238">résultat</text><rect x="600" y="285" width="230" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="715" y="328" text-anchor="middle" font-size="24" fill="#272238">rejected</text><text x="715" y="358" text-anchor="middle" font-size="24" fill="#272238">erreur</text><path d="M 265 205 L 590 135" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="427.5" y="158" text-anchor="middle" font-size="22" fill="#272238">valeur finale</text><path d="M 265 255 L 590 335" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="427.5" y="283" text-anchor="middle" font-size="22" fill="#272238">rejet</text><text x="440" y="420" text-anchor="middle" font-size="24" fill="#272238">Un règlement unique : pas de retour à pending.</text></g></svg>
