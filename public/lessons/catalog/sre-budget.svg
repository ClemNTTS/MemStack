<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Un budget lié à un objectif</title><desc id="description">Pour un SLO de 99 pour cent sur 10000 requêtes éligibles, le budget autorise 100 requêtes non conformes dans la fenêtre.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Un budget lié à un objectif</text><rect x="80" y="160" width="720" height="75" rx="10" fill="#d8c5ed"/><rect x="792" y="160" width="8" height="75" fill="#483262"/><text x="440" y="120" text-anchor="middle" font-size="24" fill="#272238">10 000 requêtes éligibles dans la fenêtre</text><text x="380" y="280" text-anchor="middle" font-size="24" fill="#272238">9 900 conformes minimum</text><text x="620" y="335" text-anchor="middle" font-size="24" fill="#272238">100 non conformes maximum</text><path d="M 790 320 L 796 245" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="405" text-anchor="middle" font-size="24" fill="#272238">Exemple par requêtes ; ce n’est pas automatiquement une durée.</text></g></svg>
