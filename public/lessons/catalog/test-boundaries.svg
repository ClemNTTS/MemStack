<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Trois périmètres de test</title><desc id="description">Le test unitaire vise une fonction ; l’intégration vise la coopération de modules ; le bout en bout vise le parcours utilisateur.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Trois périmètres de test</text><rect x="75" y="90" width="730" height="315" rx="18" fill="#eee6fa" stroke="#73539a"/><text x="440" y="128" text-anchor="middle" font-size="24" fill="#272238">Bout en bout : parcours utilisateur</text><rect x="155" y="155" width="570" height="220" rx="18" fill="#dfd0f1" stroke="#73539a"/><text x="440" y="195" text-anchor="middle" font-size="24" fill="#272238">Intégration : modules qui coopèrent</text><rect x="255" y="225" width="370" height="115" rx="18" fill="#fffdf9" stroke="#73539a"/><text x="440" y="275" text-anchor="middle" font-size="24" fill="#272238">Unitaire : une fonction</text><text x="440" y="309" text-anchor="middle" font-size="22" fill="#272238">isolée si nécessaire</text></g></svg>
