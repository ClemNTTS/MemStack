<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Trois regards sur un incident</title><desc id="description">Une métrique indique un changement, une trace situe le temps dans une requête et un journal décrit un événement.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Trois regards sur un incident</text><rect x="40" y="130" width="230" height="160" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="155" y="203" text-anchor="middle" font-size="24" fill="#272238">Métriques</text><text x="155" y="233" text-anchor="middle" font-size="24" fill="#272238">« combien ? »</text><rect x="325" y="130" width="230" height="160" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="440" y="203" text-anchor="middle" font-size="24" fill="#272238">Traces</text><text x="440" y="233" text-anchor="middle" font-size="24" fill="#272238">« où le temps ? »</text><rect x="610" y="130" width="230" height="160" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="725" y="203" text-anchor="middle" font-size="24" fill="#272238">Journaux</text><text x="725" y="233" text-anchor="middle" font-size="24" fill="#272238">« quel événement ? »</text><text x="440" y="355" text-anchor="middle" font-size="24" fill="#272238">Un contexte commun permet de relier les signaux.</text><text x="440" y="395" text-anchor="middle" font-size="24" fill="#272238">Ne journalise ni mots de passe ni jetons sensibles.</text></g></svg>
