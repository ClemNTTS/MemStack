<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Séparer instruction et donnée</title><desc id="description">Le SQL et la valeur utilisateur sont transmis séparément. Le paramètre reste une donnée et ne devient pas la syntaxe SQL.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Séparer instruction et donnée</text><rect x="45" y="115" width="350" height="130" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="220" y="173" text-anchor="middle" font-size="24" fill="#272238">SQL avec paramètre</text><text x="220" y="203" text-anchor="middle" font-size="24" fill="#272238">WHERE email = $1</text><rect x="480" y="115" width="350" height="130" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="655" y="173" text-anchor="middle" font-size="24" fill="#272238">Valeur non fiable</text><text x="655" y="203" text-anchor="middle" font-size="24" fill="#272238">email fourni</text><path d="M 225 255 L 350 310" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 655 255 L 530 310" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><rect x="265" y="320" width="350" height="85" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="440" y="370.5" text-anchor="middle" font-size="24" fill="#272238">Pilote : requête paramétrée</text></g></svg>
