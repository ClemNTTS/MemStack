<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Une fermeture garde l’accès</title><desc id="description">Une fonction interne conserve l’accès aux variables de sa portée externe même après le retour de cette dernière.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Une fermeture garde l’accès</text><rect x="70" y="85" width="740" height="320" rx="18" fill="#eee6fa" stroke="#73539a"/><text x="440" y="125" text-anchor="middle" font-size="24" fill="#272238">Portée lexicale externe</text><rect x="115" y="190" width="250" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="240" y="248" text-anchor="middle" font-size="24" fill="#272238">let count = 0</text><rect x="515" y="190" width="250" height="100" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="640" y="233" text-anchor="middle" font-size="24" fill="#272238">Fonction interne</text><text x="640" y="263" text-anchor="middle" font-size="24" fill="#272238">count += 1</text><path d="M 510 240 L 375 240" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="365" text-anchor="middle" font-size="24" fill="#272238">L’accès est conservé, pas une photographie figée de la valeur.</text></g></svg>
