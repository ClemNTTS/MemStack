<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">État souhaité et état observé</title><desc id="description">Un contrôleur observe deux pods pour un objectif de trois, puis crée un remplacement pour réduire cet écart.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">État souhaité et état observé</text><rect x="40" y="130" width="230" height="130" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="155" y="188" text-anchor="middle" font-size="24" fill="#272238">Souhaité</text><text x="155" y="218" text-anchor="middle" font-size="24" fill="#272238">3 replicas</text><rect x="335" y="130" width="230" height="130" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="450" y="188" text-anchor="middle" font-size="24" fill="#272238">Contrôleur</text><text x="450" y="218" text-anchor="middle" font-size="24" fill="#272238">compare</text><rect x="620" y="130" width="225" height="130" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="732.5" y="188" text-anchor="middle" font-size="24" fill="#272238">Observé</text><text x="732.5" y="218" text-anchor="middle" font-size="24" fill="#272238">2 pods</text><path d="M 275 195 L 325 195" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><path d="M 610 195 L 575 195" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="330" width="250" height="70" rx="14" fill="#eee6fa" stroke="#73539a" stroke-width="2"/><text x="450" y="373" text-anchor="middle" font-size="24" fill="#272238">Créer 1 pod</text><path d="M 450 270 L 450 320" fill="none" stroke="#483262" stroke-width="3" marker-end="url(#arrow)"/></g></svg>
