<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title description"><title id="title">Les couches d’une boîte CSS</title><desc id="description">De l’extérieur à l’intérieur : marge, bordure, remplissage et contenu.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#483262" stroke-width="1.5"/></marker></defs><rect width="880" height="440" rx="24" fill="#f6f3ec"/><g font-family="Arial, sans-serif"><text x="440" y="45" text-anchor="middle" font-size="28" fill="#272238">Les couches d’une boîte CSS</text><rect x="120" y="85" width="640" height="315" fill="#ded8cc"/><text x="440" y="120" text-anchor="middle" font-size="24" fill="#272238">margin : espace extérieur</text><rect x="165" y="140" width="550" height="230" fill="#73539a"/><text x="440" y="171" text-anchor="middle" font-size="24" fill="#fffdf9">border : limite visible</text><rect x="205" y="190" width="470" height="145" fill="#d8c5ed"/><text x="440" y="219" text-anchor="middle" font-size="24" fill="#272238">padding : espace intérieur</text><rect x="270" y="245" width="340" height="60" fill="#fffdf9"/><text x="440" y="284" text-anchor="middle" font-size="24" fill="#272238">contenu</text></g></svg>
