name: Verify MemStack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            tests/challenge-ai/package-lock.json
      - name: Install Java for the isolated Firestore emulator
        run: sudo apt-get update && sudo apt-get install --yes openjdk-21-jre-headless
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix tests/challenge-ai
      - run: npm run functions:build
      - run: npm test
      - run: npm run build
      - name: Authorization, quota concurrency and deletion against emulator only
        run: |
          export PATH="/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH"
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          java -version
          npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-memstack-challenge-ai "npm --prefix tests/challenge-ai run test:rules"
        env:
          CI: true
