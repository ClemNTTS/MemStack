name: Deploy MemStack to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix tests/challenge-ai
      - name: Install Java for authorization tests
        run: sudo apt-get update && sudo apt-get install --yes openjdk-21-jre-headless
      - run: npm run functions:build
      - run: npm test
      - name: Check authorization and transactions before publication
        run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-memstack-challenge-ai "npm --prefix tests/challenge-ai run test:rules"
        env:
          CI: true
      - run: npm run build -- --base=/
        env:
          VITE_CHALLENGE_AI_ENABLED: ${{ vars.CHALLENGE_AI_ENABLED || 'false' }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.FIREBASE_APPCHECK_SITE_KEY }}
          VITE_FIREBASE_APPCHECK_PROVIDER: enterprise
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
